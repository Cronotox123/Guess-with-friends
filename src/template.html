<title>Punktlandung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: eine Bildschirmspalte, Karte füllt die Mitte, Aktionen unten in Daumenreichweite */
:root{
  --bg:#101528; --panel:#1a2140; --line:#2b3561; --fg:#eef1ff; --muted:#9aa3c9;
  --sea:#1d3557; --land:#e9e4d4; --land2:#d8d1bb; --stroke:#7d8bb5;
  --accent:#ffd23f; --ok:#3ddc97; --bad:#ff6b6b;
  --display:"Bricolage Grotesque","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body,#app{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.screen{display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box;padding-block:16px;max-width:640px;margin:0 auto}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,11vw,3.4rem);line-height:.95;margin:8px 0 0;letter-spacing:-.02em;text-wrap:balance}
h1 .dot{display:inline-block;width:.32em;height:.32em;border-radius:50%;background:var(--accent);margin-left:.06em;box-shadow:0 0 0 .1em rgba(255,210,63,.25)}
h2{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;line-height:1.1;text-wrap:balance}
p{margin:0;line-height:1.5}
.muted{color:var(--muted)}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:16px 18px;font-weight:600;font-size:1.05rem;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:#1b1600;width:100%}
.primary:disabled{opacity:.35}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center}
input[type=text]{font:inherit;font-size:1.05rem;flex:1;min-width:0;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px}
.players{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;margin:0}
.players li{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:12px;padding:10px 12px}
.chip{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid #fff}
.players li span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.x{background:transparent;color:var(--muted);padding:6px 10px;font-size:1.3rem}
.spacer{flex:1}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.lvl.leicht{color:var(--ok)} .lvl.mittel{color:var(--accent)} .lvl.schwer{color:var(--bad)}
.qtext{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1.15;text-wrap:balance}
.turn{display:flex;align-items:center;gap:10px;font-weight:600}
.mapwrap{position:relative;border-radius:16px;overflow:hidden;background:var(--sea);border:1px solid var(--line);width:100%;max-height:68vh;margin:0 auto;touch-action:none}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sea{fill:var(--sea)} .land{fill:var(--land2);stroke:none} .de{fill:var(--land);stroke:var(--stroke);stroke-width:.8;vector-effect:non-scaling-stroke}
.border{fill:none;stroke:var(--stroke);stroke-width:.7;vector-effect:non-scaling-stroke}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.zoom button{width:40px;height:40px;padding:0;border-radius:12px;background:rgba(16,21,40,.85);color:var(--fg);font-size:1.4rem;border:1px solid var(--line)}
.hint{position:absolute;left:8px;top:8px;font-size:.78rem;background:rgba(16,21,40,.8);padding:5px 9px;border-radius:8px;color:var(--fg);pointer-events:none}
.cover{justify-content:center;text-align:center;align-items:center}
.phead{margin:6px 0 10px}.phead .bigname{font-size:clamp(2rem,10vw,3rem)}
.bigname{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,13vw,4rem);line-height:1;overflow-wrap:anywhere}
.results{display:flex;flex-direction:column;gap:6px;list-style:none;padding:0;margin:0}
.results li{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px 12px}
.results li .n{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.results .km{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.res{font-weight:800;width:1.6em;text-align:center}
.res.ok{color:var(--ok)} .res.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:12px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.pts{font-family:var(--display);font-weight:800;font-size:1.4rem;text-align:right}
th.pts{text-align:right}
tr.win td{color:var(--accent)}
.tablewrap{overflow-x:auto}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.fade{animation:fade .7s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.pop,.fade{animation:none}}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.solve{display:flex;flex-direction:column;gap:6px;background:var(--panel);border-radius:14px;padding:12px 14px}
.sol{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.2}
.sol strong{color:var(--accent)}
.arrow{color:var(--muted)}
.riddle{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.screen.host{max-width:1100px}
.qtext.big{font-size:clamp(1.5rem,3.6vw,2.4rem)}
.hostgrid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:820px){.hostgrid{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
.lobby{display:grid;grid-template-columns:1fr;gap:18px;align-items:center}
@media (min-width:700px){.lobby{grid-template-columns:260px minmax(0,1fr)}}
.qrbox{box-sizing:border-box;background:#fff;border-radius:16px;padding:10px;width:min(260px,100%);aspect-ratio:1;display:grid;place-items:center;color:#101528}
.qrbox svg{width:100%;height:100%}
.lobbyinfo{display:flex;flex-direction:column;gap:8px;min-width:0}
.joinurl{font-weight:600;overflow-wrap:anywhere}
.code{font-family:var(--display);font-weight:800;font-size:3.2rem;letter-spacing:.15em;color:var(--accent)}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.diff{padding:10px 6px;font-size:.9rem;background:var(--panel);color:var(--fg);border:2px solid var(--line);min-height:44px}
.diff.on{border-color:var(--accent);background:var(--accent);color:#1b1600;font-weight:700}
.small{font-size:.85rem;margin-top:6px}
.modes{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.modes{grid-template-columns:1fr 1fr}}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel);color:var(--fg);border:2px solid var(--line)}
.mode span{font-weight:400;font-size:.9rem;color:var(--muted)}
.mode.on{border-color:var(--accent)}
.board{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;counter-reset:b}
.board li{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:10px;padding:8px 12px;counter-increment:b}
.board li::before{content:counter(b);color:var(--muted);font-variant-numeric:tabular-nums;width:1.2em}
.board li span{flex:1;min-width:0;overflow-wrap:anywhere}
.board b{font-family:var(--display);font-size:1.2rem}
/* Spielansicht passt immer auf den Bildschirm: Karte schrumpft, Knopf bleibt unten sichtbar */
.screen.fit{height:100vh;height:100dvh;min-height:0}
.screen.fit .mapwrap{flex:1 1 0;min-height:160px;max-height:none;aspect-ratio:auto!important}
.ghost.stick{background:var(--bg)}
.stick{position:sticky;bottom:max(10px, env(safe-area-inset-bottom, 0px));z-index:5;box-shadow:0 -10px 18px var(--bg)}
.cover{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;justify-content:center;flex:1}
.res.half{color:var(--accent)}
.rms{grid-template-columns:repeat(2,1fr);margin-top:8px}
@media (min-width:520px){.rms{grid-template-columns:repeat(4,1fr)}}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.abtn{align-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:1.3rem;padding:22px 10px;min-height:72px}
.abtn.on{background:var(--accent);color:#1b1600}
.guess{display:flex;flex-direction:column;gap:10px}
.gin{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:0 14px}
.gin:focus-within{border-color:var(--accent)}
.gin input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;font-family:var(--display);font-weight:800;font-size:1.8rem;padding:14px 0;outline:none}
.unit{font-weight:600;color:var(--muted);font-size:1.1rem;white-space:nowrap}
.solve a{color:var(--fg)}
.tbq{border:2px solid var(--accent);border-radius:14px;padding:12px 14px}
.lang{align-self:flex-end;color:var(--muted);font-size:.85rem;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px;margin-bottom:-6px}
</style>

<div id="app"></div>

<script>
const DATA = __DATA__;
const COLORS = ['#ff6b6b','#4dabf7','#3ddc97','#c084fc','#ff9f43','#f06595','#20c997','#a9e34b','#74c0fc','#ffa8a8','#e599f7','#ffd8a8'];
const app = document.getElementById('app');
const ROUND = 10;
let S = load() || {phase:'setup', players:[], q:0, turn:0, dots:{}, scores:{}, history:[]};
let tmpDot = null;

const RATEN = __RATEN__;
function curQ(){ return DATA.questions[S.set[S.q]]; }
/* Eine Frage im Spiel ist entweder ein Kartenrätsel (Zahl = Index in DATA.questions) oder eine Ratefrage ({r: Index in RATEN}) */
function isR(it){ return !!it && typeof it==='object'; }
function itemOk(it){ return Number.isInteger(it) ? !!DATA.questions[it] : (isR(it) && Number.isInteger(it.r) && !!RATEN[it.r]); }
function save(){ try{ localStorage.setItem('mmnp', JSON.stringify(S)); }catch(e){} }
function load(){ try{
  const s = JSON.parse(localStorage.getItem('mmnp'));
  if(!s || !s.phase || !Array.isArray(s.players)) return null;
  if(s.phase==='setup') return s;
  const ok = Array.isArray(s.set) && s.set.length===10 && s.set.every(itemOk) && (!/^t/.test(s.phase) || (s.tb && RATEN[s.tb.r]));
  return ok ? s : {phase:'setup', players:s.players, q:0, turn:0, dots:{}, scores:{}, history:[]};
}catch(e){ return null; } }
/* Schwierigkeit: wird beim Start gewählt und gemerkt */
const PLANS = {
  leicht:{name:'Leicht', plan:Array(10).fill('leicht')},
  lm:{name:'Leicht/Mittel', plan:['leicht','leicht','mittel','leicht','mittel','leicht','mittel','mittel','leicht','mittel']},
  mittel:{name:'Mittel', plan:Array(10).fill('mittel')},
  ms:{name:'Mittel/Schwer', plan:['mittel','mittel','schwer','mittel','schwer','mittel','schwer','mittel','schwer','schwer']},
  schwer:{name:'Schwer', plan:Array(10).fill('schwer')},
  alle:{name:'Alle Fragen', plan:['leicht','leicht','leicht','mittel','leicht','mittel','mittel','leicht','mittel','schwer']},
};
function getDiff(){ try{ const d=localStorage.getItem('pl-diff'); if(PLANS[d]) return d; }catch(e){} return 'alle'; }
function setDiff(d){ try{ localStorage.setItem('pl-diff', d); }catch(e){} }
function diffPicker(){ const cur=getDiff(); return `<p class="label">Schwierigkeit</p><div class="diffs">${Object.entries(PLANS).map(([k,p])=>`<button type="button" class="diff ${k===cur?'on':''}" data-diff="${k}">${p.name}</button>`).join('')}</div><p class="muted small">${cur==='alle'?'Leichter Einstieg, schweres Finale.':'Alle 10 Rätsel aus dieser Stufe.'}</p>`; }
function bindDiff(rerender){ app.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{ setDiff(b.dataset.diff); rerender(); }); }
/* 10 Fragen ziehen: zuerst leicht, dann leicht und mittel, zum Schluss schwer. Bereits gespielte Fragen kommen erst wieder, wenn der Katalog durch ist. */
function drawSet(){
  let used = []; try{ used = JSON.parse(localStorage.getItem('mmnp-used')) || []; }catch(e){}
  let rused = []; try{ rused = JSON.parse(localStorage.getItem('pl-rused')) || []; }catch(e){}
  const usedSet = new Set(used), rusedSet = new Set(rused);
  const pool = lvl => { const all = DATA.questions.map((q,i)=>i).filter(i=>DATA.questions[i].lvl===lvl); const fresh = all.filter(i=>!usedSet.has(i)); return fresh.length >= 10 ? fresh : all; };
  const pick = (ids, lastMaps) => { const pref = ids.filter(i=>!lastMaps.includes(DATA.questions[i].map)); const from = pref.length ? pref : ids; return from[Math.floor(Math.random()*from.length)]; };
  const rms = getRm();
  // Ratefragen: gewünschte Stufe, sonst die nächstliegende; möglichst nicht zweimal derselbe Modus hintereinander
  const rpick = (lvl, taken, lastM) => {
    const order = {leicht:['leicht','mittel','schwer'], mittel:['mittel','leicht','schwer'], schwer:['schwer','mittel','leicht']}[lvl];
    let ids = [];
    for(const l of order){ const all = RATEN.map((q,i)=>i).filter(i=>RATEN[i].s===l && rms.includes(RATEN[i].m) && !taken.includes(i)); const fresh = all.filter(i=>!rusedSet.has(i)); ids = fresh.length ? fresh : all; if(ids.length) break; }
    if(!ids.length) ids = RATEN.map((q,i)=>i).filter(i=>!taken.includes(i));
    const pref = ids.filter(i=>RATEN[i].m!==lastM); const from = pref.length ? pref : ids;
    return from[Math.floor(Math.random()*from.length)];
  };
  const plan = PLANS[getDiff()].plan, cat = getCat();
  const set = [];
  plan.forEach((lvl, k)=>{
    const raten = cat==='raten' || (cat==='mix' && k%2===1);
    if(raten){
      const taken = set.filter(isR).map(it=>it.r), lastR = set.filter(isR).slice(-1)[0];
      set.push({r: rpick(lvl, taken, lastR ? RATEN[lastR.r].m : null)});
      return;
    }
    const ks = set.filter(i=>!isR(i));
    const last = ks.slice(-2).map(i=>DATA.questions[i].map);
    const ids = pool(lvl).filter(i=>!ks.includes(i) && !ks.some(j=>DATA.questions[j].t===DATA.questions[i].t));
    set.push(pick(ids, last.length===2 && last[0]===last[1] ? [last[0]] : []));
  });
  const ks = set.filter(i=>!isR(i)), rs = set.filter(isR).map(it=>it.r);
  let next = [...used, ...ks]; if(next.length > DATA.questions.length - 40) next = ks;
  let rnext = [...rused, ...rs]; if(rnext.length > RATEN.length - 40) rnext = rs;
  try{ localStorage.setItem('mmnp-used', JSON.stringify(next)); localStorage.setItem('pl-rused', JSON.stringify(rnext)); }catch(e){}
  return set;
}
/* ---------- Kategorie: Karte, Raten oder gemischt ---------- */
const CATS = {
  karte:{name:'Karte', info:'Nur Kartenrätsel: Rätsel lösen, Ort tippen.'},
  raten:{name:'Raten', info:'Nur Ratefragen. Bis 5 % daneben gibt 1 Treffer, bis 20 % einen halben. Bei Gleichstand gewinnt, wer im Schnitt weniger Prozent daneben lag.'},
  mix:{name:'Gemischt', info:'Abwechselnd Karte und Raten. Es zählen nur Treffer, bei Gleichstand entscheidet eine Schätz-Stechfrage.'},
};
const RMODES = {
  gk:{name:'Größer oder kleiner', short:'Größer/Kleiner'},
  schaetzen:{name:'Zahlen schätzen', short:'Schätzen'},
  kalorien:{name:'Kalorien raten', short:'Kalorien'},
  preise:{name:'Preise raten', short:'Preise'},
};
function getCat(){ try{ const c=localStorage.getItem('pl-cat'); if(CATS[c]) return c; }catch(e){} return 'karte'; }
function setCat(c){ try{ localStorage.setItem('pl-cat', c); }catch(e){} }
function getRm(){ try{ const a=JSON.parse(localStorage.getItem('pl-rm')); if(Array.isArray(a)){ const f=a.filter(m=>RMODES[m]); if(f.length) return f; } }catch(e){} return Object.keys(RMODES); }
function setRm(a){ try{ localStorage.setItem('pl-rm', JSON.stringify(a)); }catch(e){} }
function catPicker(){
  const cur = getCat(), rm = getRm();
  return `<p class="label">Kategorie</p><div class="diffs">${Object.entries(CATS).map(([k,c])=>`<button type="button" class="diff ${k===cur?'on':''}" data-cat="${k}">${c.name}</button>`).join('')}</div>
    ${cur!=='karte'?`<div class="diffs rms">${Object.entries(RMODES).map(([k,m])=>`<button type="button" class="diff ${rm.includes(k)?'on':''}" data-rm="${k}" aria-pressed="${rm.includes(k)}">${m.short}</button>`).join('')}</div>`:''}
    <p class="muted small">${CATS[cur].info}</p>`;
}
function bindCat(rerender){
  app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ setCat(b.dataset.cat); rerender(); });
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ let a=getRm(); const m=b.dataset.rm; a = a.includes(m) ? a.filter(x=>x!==m) : [...a, m]; if(a.length) setRm(a); rerender(); });
}
/* ---------- Ratefragen: Eingabe, Wertung, Anzeige ---------- */
function parseNum(s){
  s = String(s).replace(/[\s '€$%]/g,'').replace(/[a-zäöü.]+$/i,'');
  if(!s) return null;
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  if(!/^\d*\.?\d+$|^\d+\.$/.test(s)) return null;
  const v = parseFloat(s); return isFinite(v) ? v : null;
}
function fmtNum(v){ return Number(v).toLocaleString('de-DE', {maximumFractionDigits: Math.abs(v)<100 ? 2 : Math.abs(v)<10000 ? 1 : 0}); }
function fmtPct(d){ return (d>=2?'≥ ':'') + (d*100).toLocaleString('de-DE', {maximumFractionDigits: d<0.1 ? 1 : 0}) + ' %'; }
function fmtPts(x){ return String(Math.round(x*10)/10).replace('.', ','); }
/* Größer/Kleiner: richtig = 1. Zahlen: bis 5 % daneben = 1, bis 20 % = ½. dev = Abweichung (für den Gleichstand, gedeckelt bei 200 %) */
function judgeR(q, a){
  if(q.m==='gk'){ const hit = !!a && a.c===q.c; return {hit, pts:hit?1:0, dev:null}; }
  const g = a ? +a.g : NaN;
  if(!isFinite(g)) return {hit:false, pts:0, dev:2};
  const dev = Math.min(2, Math.abs(g-q.v)/Math.abs(q.v));
  const pts = dev<=0.05 ? 1 : dev<=0.2 ? 0.5 : 0;
  return {hit:pts>0, pts, dev};
}
function rAnsText(q, a){
  if(!a) return '–';
  if(q.m==='gk') return esc(q.o[a.c] || '–');
  return esc(fmtNum(a.g) + (q.u ? ' '+q.u : ''));
}
function rHead(q, label){
  return `<div class="qhead"><span class="label">${label}</span><span class="lvl ${q.s}">${q.s}</span></div>
    <div class="riddle">${RMODES[q.m].name}</div>
    <div class="qtext">${esc(q.q)}</div>`;
}
function guessHTML(q, btn){
  if(q.m==='gk') return `<div class="ab">${q.o.map((o,k)=>`<button type="button" class="mode abtn" data-ab="${k}">${esc(o)}</button>`).join('')}</div>
    <div class="spacer"></div><button class="primary stick" id="ok" disabled>${btn}</button>`;
  return `<form id="gf" class="guess" autocomplete="off">
    <div class="gin"><input type="text" inputmode="decimal" enterkeyhint="done" id="gv" placeholder="Deine Schätzung" aria-label="Deine Schätzung">${q.u?`<span class="unit">${esc(q.u)}</span>`:''}</div>
    <p class="muted small" id="gecho">&nbsp;</p>
    <button class="primary" id="ok" type="submit" disabled>${btn}</button></form>`;
}
function bindGuess(q, done){
  const ok = document.getElementById('ok'); let ans = null;
  if(q.m==='gk'){
    app.querySelectorAll('[data-ab]').forEach(b=>b.onclick=()=>{ ans={c:+b.dataset.ab}; app.querySelectorAll('[data-ab]').forEach(x=>x.classList.toggle('on', x===b)); ok.disabled=false; });
    ok.onclick = ()=>{ if(ans) done(ans, ok); };
    return;
  }
  const inp = document.getElementById('gv'), echo = document.getElementById('gecho');
  inp.oninput = ()=>{ const v = parseNum(inp.value); ans = v===null ? null : {g:v}; ok.disabled = !ans; echo.textContent = ans ? '= ' + fmtNum(v) + (q.u?' '+q.u:'') : (inp.value.trim() ? 'Bitte nur eine Zahl eingeben' : ' '); };
  document.getElementById('gf').onsubmit = e=>{ e.preventDefault(); if(ans){ inp.blur(); done(ans, ok); } };

function srcLinks(src){
  const urls = String(src).match(/https?:\/\/[^\s]+/g) || [];
  if(!urls.length) return esc(src);
  return urls.map(u=>{ let h=u; try{ h=new URL(u).hostname.replace(/^www\./,''); }catch(e){} return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(h)}</a>`; }).join(', ');
}
function rSolve(q){
  return `<div class="solve"><span class="label">Richtige Antwort</span><div class="sol"><strong>${esc(q.a)}</strong></div><p class="muted small">Quelle: ${srcLinks(q.src)}</p></div>`;
}
/* rows: {n, c, a, hit, pts, dev} */
function rRows(q, rows){
  return `<ul class="results">${rows.map((r,k)=>`<li><span class="res ${r.pts==null?'half':r.pts>=1?'ok':r.pts>0?'half':'bad'}">${r.pts==null?(k===0?'★':''):r.pts>=1?'✓':r.pts>0?'½':'✗'}</span><i class="chip" style="background:${r.c}"></i><span class="n">${esc(r.n)}</span><span class="km">${rAnsText(q, r.a)}${q.m!=='gk'&&r.dev!=null?' · '+fmtPct(r.dev):''}${r.pts!=null?' · +'+fmtPts(r.pts):''}</span></li>`).join('') || '<li>Keiner hat geantwortet.</li>'}</ul>`;
}
function rSummary(rows){
  const full = rows.filter(r=>r.pts>=1).length, half = rows.filter(r=>r.pts>0 && r.pts<1).length;
  if(rows.length===1) return full ? 'Richtig!' : half ? 'Knapp dran!' : 'Daneben';
  if(!full && !half) return 'Niemand lag richtig';
  if(full===rows.length) return 'Alle lagen richtig!';
  return `${full} richtig${half?`, ${half} knapp dran`:''}`;
}
/* Stechfrage: eine Schätzfrage, die im Spiel noch nicht vorkam */
function pickTie(set){
  const taken = (set||[]).filter(isR).map(it=>it.r);
  const ids = RATEN.map((q,i)=>i).filter(i=>RATEN[i].m==='schaetzen' && !taken.includes(i));
  return ids[Math.floor(Math.random()*ids.length)];
}

function topTie(list, key){ if(list.length<2) return []; const top=Math.max(...list.map(key)); const t=list.filter(x=>key(x)===top); return t.length>1 ? t : []; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- Karte mit Zoom ---------- */
function mapSVG(m){
  return `<svg viewBox="0 0 ${m.w} ${m.h}" preserveAspectRatio="xMidYMid meet" aria-label="Karte">
    ${m.layers.map(([c,d])=>`<path class="${c}" d="${d}"/>`).join('')}
    <g id="over"></g></svg>`;
}
function setupMap(wrap, m, onTap){
  const svg = wrap.querySelector('svg');
  let vb = {x:0,y:0,w:m.w,h:m.h};
  const apply = ()=>{ svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); if(wrap._onzoom) wrap._onzoom(); };
  const clamp = ()=>{
    vb.w = Math.min(m.w, Math.max(m.w/12, vb.w)); vb.h = vb.w*m.h/m.w;
    vb.x = Math.min(m.w-vb.w, Math.max(0, vb.x)); vb.y = Math.min(m.h-vb.h, Math.max(0, vb.y));
  };
  // SVG-Einheiten pro Bildschirmpixel
  const unit = ()=>{ const r = svg.getBoundingClientRect(); return Math.max(vb.w/r.width, vb.h/r.height); };
  const toSvg = (cx,cy)=>{ const p = svg.createSVGPoint(); p.x=cx; p.y=cy; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  const zoomAt = (f, cx, cy)=>{ const p = toSvg(cx,cy); vb.x = p.x-(p.x-vb.x)/f; vb.y = p.y-(p.y-vb.y)/f; vb.w/=f; vb.h/=f; clamp(); apply(); };
  const pts = new Map(); let moved=false, start=null, pinch=null;
  wrap.addEventListener('pointerdown', e=>{
    if(e.target.closest('.zoom')) return;
    wrap.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ moved=false; start={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y}; }
    if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}; moved=true; }
  });
  wrap.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2 && pinch){
      const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
      zoomAt(d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2); pinch.d=d;
    } else if(pts.size===1 && start){
      const dx=e.clientX-start.x, dy=e.clientY-start.y;
      if(Math.hypot(dx,dy)>8) moved=true;
      if(moved && vb.w<m.w){ const u=unit(); vb.x=start.vx-dx*u; vb.y=start.vy-dy*u; clamp(); apply(); }
    }
  });
  const up = e=>{
    if(!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if(pts.size<2) pinch=null;
    if(pts.size===0){ if(!moved && onTap){ const p=toSvg(e.clientX,e.clientY); if(p.x>=0&&p.y>=0&&p.x<=m.w&&p.y<=m.h) onTap(p.x,p.y); } start=null; }
    else { const [a]=[...pts.values()]; start={x:a.x,y:a.y,vx:vb.x,vy:vb.y}; }
  };
  wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', e=>{ moved=true; up(e); });
  wrap.addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(e.deltaY<0?1.25:0.8, e.clientX, e.clientY); }, {passive:false});
  wrap.querySelector('[data-z="in"]').onclick = ()=>{ const b=svg.getBoundingClientRect(); zoomAt(1.6, b.left+b.width/2, b.top+b.height/2); };
  wrap.querySelector('[data-z="out"]').onclick = ()=>{ const b=svg.getBoundingClientRect(); zoomAt(1/1.6, b.left+b.width/2, b.top+b.height/2); };
  wrap.querySelector('[data-z="reset"]').onclick = ()=>{ vb={x:0,y:0,w:m.w,h:m.h}; apply(); };
  return {unit, zoomTo(x,y,w){ vb.w=w; vb.h=w*m.h/m.w; vb.x=x-vb.w/2; vb.y=y-vb.h/2; clamp(); apply(); }};
}
const zoomButtons = `<div class="zoom"><button data-z="in" aria-label="Hineinzoomen">+</button><button data-z="out" aria-label="Herauszoomen">−</button><button data-z="reset" aria-label="Ganze Karte">⤢</button></div>`;
function dotMarkup(x,y,c,u,label){
  const r = 8*u;
  return `<g class="pop" style="transform-origin:${x}px ${y}px"><circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="#fff" stroke-width="${2.5*u}"/>${label?`<text x="${x+r+3*u}" y="${y+4*u}" font-size="${13*u}" font-weight="700" fill="#fff" stroke="#101528" stroke-width="${3*u}" paint-order="stroke" font-family="Inter,system-ui,sans-serif">${esc(label)}</text>`:''}</g>`;
}

/* ---------- Ziel: Kreis oder Fläche (Land, Gebiet, Fluss) ---------- */
const SHP = {};
function shape(q){
  if(!q.g || !DATA.shapes || !DATA.shapes[q.g]) return null;
  if(SHP[q.g]) return SHP[q.g];
  const raw = DATA.shapes[q.g];
  const rings = raw.d.split(';').map(r=>{ const n=r.split(',').map(Number), out=[]; let x=0,y=0; for(let i=0;i+1<n.length;i+=2){ x+=n[i]; y+=n[i+1]; out.push([x/10,y/10]); } return out; });
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; rings.forEach(r=>r.forEach(([x,y])=>{ x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y); }));
  const line = raw.c==='f';
  const d = rings.map(r=>'M'+r.map(p=>p[0]+','+p[1]).join('L')+(line?'':'Z')).join('');
  return SHP[q.g] = {c:raw.c, line, rings, d, box:[x0,y0,x1,y1]};
}
function segDist(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy; let t = L ? ((px-ax)*dx+(py-ay)*dy)/L : 0; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-ax-t*dx, py-ay-t*dy); }
/* Abstand in px zum Ziel (0 = in der Fläche) und ob es zählt */
function judge(q, x, y){
  const sh = shape(q);
  if(!sh){ const d = Math.hypot(x-q.x, y-q.y); return {d, band:q.r, hit:d<=q.r, km:Math.round(d/q.k)}; }
  let inside = false, best = 1e9;
  for(const r of sh.rings){
    const n = r.length;
    if(n===1){ best = Math.min(best, Math.hypot(x-r[0][0], y-r[0][1])); continue; }
    for(let i=0, j=sh.line?0:n-1; i<n; j=i++){
      if(sh.line && i===0) continue;
      const [xi,yi]=r[i], [xj,yj]=r[j];
      if(!sh.line && ((yi>y)!==(yj>y)) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside = !inside;
      best = Math.min(best, segDist(x,y,xi,yi,xj,yj));
    }
  }
  const d = inside ? 0 : best;
  return {d, band:q.b, hit:d<=q.b, km:Math.round(d/q.k)};
}
/* Punkte: Kreis-Modus 1/0; Distanz-Modus 100 im Ziel, dann abnehmend */
function ptsFor(mode, j, q){
  if(mode === 'kreis') return j.hit ? 1 : 0;
  if(!q.g) return Math.max(0, Math.round(100 * (1 - j.d / (4 * q.r))));
  return j.d <= j.band ? 100 : Math.max(0, Math.round(100 * (1 - (j.d - j.band) / (3 * q.r))));
}
function targetText(q){
  const sh = shape(q);
  if(!sh) return `Kreis: ${q.km} km Radius.`;
  if(sh.line) return `Ziel ist der Flusslauf, ${q.bk} km links und rechts zählen mit.`;
  return `Ziel ist die ganze Fläche, dazu ${q.bk} km Spielraum am Rand.`;
}
function targetSVG(q, u, anim){
  const sh = shape(q), pop = anim ? 'class="pop"' : '';
  if(!sh) return `<circle cx="${q.x}" cy="${q.y}" r="${q.r}" fill="rgba(255,210,63,.28)" stroke="#ffd23f" stroke-width="${3*u}" ${pop} style="transform-origin:${q.x}px ${q.y}px"/><circle cx="${q.x}" cy="${q.y}" r="${3*u}" fill="#ffd23f"/>`;
  const fx = anim ? 'class="fade"' : '';
  if(sh.line) return `<g ${fx}><path d="${sh.d}" fill="none" stroke="#ffd23f" stroke-opacity=".28" stroke-width="${2*q.b}" stroke-linecap="round" stroke-linejoin="round"/><path d="${sh.d}" fill="none" stroke="#ffd23f" stroke-width="${3.5*u}" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  return `<g ${fx}><path d="${sh.d}" fill="#ffd23f" fill-opacity=".18" stroke="#ffd23f" stroke-opacity=".18" stroke-width="${2*q.b}" stroke-linejoin="round" fill-rule="evenodd"/><path d="${sh.d}" fill="#ffd23f" fill-opacity=".45" stroke="#ffd23f" stroke-width="${2*u}" stroke-linejoin="round" fill-rule="evenodd"/></g>`;
}
/* Ausschnitt fürs Zoomen: Ziel + alle Punkte */
function revealZoom(ctl, m, q, pts){
  const sh = shape(q), b = sh ? q.b : q.r;
  const box = sh ? sh.box : [q.x,q.y,q.x,q.y];
  const xs=[box[0]-b, box[2]+b, ...pts.map(d=>d.x)], ys=[box[1]-b, box[3]+b, ...pts.map(d=>d.y)];
  const bw = Math.max(Math.max(...xs)-Math.min(...xs),(Math.max(...ys)-Math.min(...ys))*m.w/m.h)*1.4;
  ctl.zoomTo((Math.max(...xs)+Math.min(...xs))/2,(Math.max(...ys)+Math.min(...ys))/2, Math.max(bw, sh ? 60 : q.r*6));
}

function score(){
  const it = S.set[S.q];
  if(isR(it)){
    const q = RATEN[it.r];
    S.history[S.q] = S.players.map(p=>{ const a = S.dots[p], j = judgeR(q, a); S.scores[p] += j.pts; return {p, hit:j.hit, pts:j.pts, dev:j.dev, a}; });
    return;
  }
  const q = curQ();
  const res = S.players.map(p=>{
    const d = S.dots[p], j = judge(q, d.x, d.y);
    if(j.hit) S.scores[p]++;
    return {p, hit:j.hit, km:j.km, pts:j.hit?1:0};
  });
  S.history[S.q] = res;
}
/* ---------- Ratefrage: Antwort eingeben ---------- */
function renderGuess(){

}

  app.innerHTML = `<div class="screen">

  </div>`;

/* ---------- Stechfrage (Gemischt, Gleichstand an der Spitze) ---------- */
function renderTGuess(){
  const q = RATEN[S.tb.r], p = S.tb.players[S.tb.turn], i = S.players.indexOf(p);
  app.innerHTML = `<div class="screen">
    <div class="tbq">${rHead(q, 'Stechfrage · am nächsten dran gewinnt')}</div>
    <div class="turn"><i class="chip" style="background:${color(i)}"></i>${esc(p)} ist dran</div>
    ${guessHTML(q, 'OK, Antwort bestätigen')}
  </div>`;
  bindGuess(q, ans=>{
    S.tb.g[p] = ans;
    if(S.tb.turn < S.tb.players.length-1){ S.tb.turn++; go('tpass'); }
    else { S.tb.res = S.tb.players.map(n=>({p:n, a:S.tb.g[n], dev:judgeR(q, S.tb.g[n]).dev})).sort((a,b)=>a.dev-b.dev); go('treveal'); }
  });
}
function renderTReveal(){
  const q = RATEN[S.tb.r], best = S.tb.res[0].dev, win = S.tb.res.filter(r=>r.dev===best).map(r=>r.p);
  app.innerHTML = `<div class="screen">
    ${rHead(q, 'Auflösung · Stechfrage')}
    ${rSolve(q)}
    <h2>${win.length>1?'Wieder gleich nah dran!':esc(win[0])+' lag am nächsten'}</h2>
    ${rRows(q, S.tb.res.map(r=>({...r, n:r.p, c:color(S.players.indexOf(r.p)), pts:null})))}
    <div class="spacer"></div>
    <button class="primary stick" id="next">Zur Endwertung</button>
  </div>`;
  document.getElementById('next').onclick = ()=>go('end');
}

/* ---------- Auswertung pro Frage ---------- */
function renderReveal(){
  if(isR(S.set[S.q])) return renderRevealR();
  const q = curQ(), m = DATA.maps[q.map], res = S.history[S.q];
  const last = S.q === ROUND-1;
  const hits = res.filter(r=>r.hit).length;
  const sorted = [...res].sort((a,b)=>a.km-b.km);
  app.innerHTML = `<div class="screen">
    <div class="qhead"><span class="label">Auflösung · Frage ${S.q+1} / ${ROUND}</span><span class="lvl ${q.lvl}">${q.lvl}</span></div>
    <div class="qtext">${esc(q.t)}</div>
    <div class="solve"><span class="label">Gemeint war</span><div class="sol">${esc(q.s)} <span class="arrow">→</span> <strong>${esc(q.o)}</strong></div><p class="muted">${esc(q.a)} ${targetText(q)}</p></div>
    <div class="mapwrap" id="mw" style="aspect-ratio:${m.w}/${Math.max(m.h, m.w*0.62)}">${mapSVG(m)}${zoomButtons}</div>
    <h2>${hits===0?'Niemand lag richtig':hits===res.length?(res.length===1?'Richtig!':'Alle lagen richtig!'):`${hits} von ${res.length} lagen richtig`}</h2>
    <ul class="results">${sorted.map(r=>`<li><span class="res ${r.hit?'ok':'bad'}">${r.hit?'✓':'✗'}</span><i class="chip" style="background:${color(S.players.indexOf(r.p))}"></i><span class="n">${esc(r.p)}</span><span class="km">${r.km} km daneben</span></li>`).join('')}</ul>
    <button class="primary stick" id="next">${last?'Zur Endwertung':'Nächste Frage'}</button>
  </div>`;
  const wrap = document.getElementById('mw'), over = wrap.querySelector('#over');
  let ctl;
  const draw = (anim)=>{
    const u = ctl.unit();
    let s = targetSVG(q, u, anim);
    S.players.forEach((p,i)=>{ const d=S.dots[p]; s += dotMarkup(d.x,d.y,color(i),u,p); });
    over.innerHTML = anim ? s : s.replace(/class="pop"/g,'');
  };
  ctl = setupMap(wrap, m, null);
  wrap._onzoom = ()=>draw(false);
  // Auf Kreis und alle Punkte zoomen
  revealZoom(ctl, m, q, S.players.map(p=>S.dots[p]));
  draw(true);
  document.getElementById('next').onclick = ()=>{
    if(last) go('end'); else { S.q++; S.turn=0; S.dots={}; go('pass'); }
  };
}

/* ---------- Endwertung ---------- */
/* Karte allein: Treffer, dann km. Raten allein: Treffer, dann Ø Abweichung in %. Gemischt: nur Treffer, bei Gleichstand Stechfrage. */
function endRows(){
  const cat = S.cat || 'karte';
  const rows = S.players.map((p,i)=>{
    const hs = S.history.map(h=>(h||[]).find(r=>r.p===p)).filter(Boolean);
    const km = hs.reduce((a,r)=>a+(r.km||0),0), devs = hs.filter(r=>r.dev!=null).map(r=>r.dev);
    return {p, i, pts:S.scores[p], km, dev: devs.length ? devs.reduce((a,b)=>a+b,0)/devs.length : null};
  });
  const tbd = p=>{ const r = S.tb && S.tb.res && S.tb.res.find(x=>x.p===p); return r ? r.dev : 99; };
  rows.sort((a,b)=>b.pts-a.pts || (cat==='karte' ? a.km-b.km : cat==='raten' ? (a.dev??9)-(b.dev??9) : tbd(a.p)-tbd(b.p)));
  return {cat, rows};
}
function renderEnd(){
  const {cat, rows} = endRows(), top = rows[0];
  const tie = cat==='mix' ? topTie(rows, r=>r.pts) : [];
  if(tie.length && !(S.tb && S.tb.res)){
    app.innerHTML = `<div class="screen cover">
      <p class="label">Endwertung</p>
      <h1>Gleichstand<span class="dot"></span></h1>
      <p class="muted">${tie.map(r=>esc(r.p)).join(', ')} haben je ${fmtPts(top.pts)} Treffer. Eine Schätzfrage entscheidet: Wer am nächsten dran ist, gewinnt.</p>
      <div class="spacer"></div>
      <button class="primary" id="tb">Stechfrage starten</button>
    </div>`;
    document.getElementById('tb').onclick = ()=>{ S.tb = {r:pickTie(S.set), players:tie.map(r=>r.p), turn:0, g:{}}; go('tpass'); };
    return;
  }
  const sec = cat==='karte' ? ['km daneben', r=>r.km.toLocaleString('de-DE')] : cat==='raten' ? ['Ø daneben', r=>r.dev==null?'–':fmtPct(r.dev)] : null;
  const winners = tie.length && S.tb && S.tb.res ? S.tb.res.filter(r=>r.dev===S.tb.res[0].dev).map(r=>r.p) : [top.p];
  const note = cat==='karte' ? 'Bei Gleichstand entscheidet, wer insgesamt weniger Kilometer daneben lag.'
    : cat==='raten' ? 'Bei Gleichstand entscheidet, wer im Schnitt weniger Prozent daneben lag.'
    : (S.tb && S.tb.res ? `Gleichstand, die Stechfrage hat entschieden.` : 'Es zählen nur Treffer.');
  app.innerHTML = `<div class="screen">
    <p class="label">Endwertung · ${CATS[cat].name}</p>
    <h1>${winners.map(esc).join(' und ')} ${winners.length>1?'gewinnen':'gewinnt'}<span class="dot"></span></h1>
    <p class="muted">${fmtPts(top.pts)} von ${ROUND} Treffern. ${note}</p>
    <div class="tablewrap"><table>
      <thead><tr><th>#</th><th>Spieler</th>${sec?`<th>${sec[0]}</th>`:''}<th class="pts">Treffer</th></tr></thead>
      <tbody>${rows.map((r,k)=>`<tr class="${winners.includes(r.p)?'win':''}"><td>${k+1}</td><td><span class="row"><i class="chip" style="background:${color(r.i)}"></i>${esc(r.p)}</span></td>${sec?`<td>${sec[1](r)}</td>`:''}<td class="pts">${fmtPts(r.pts)}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="spacer"></div>
    <button class="primary" id="again">Nochmal mit denselben Spielern</button>
    <button class="ghost" id="newp">Neue Spieler eintragen</button>
  </div>`;
  document.getElementById('again').onclick = ()=>newGame();
  document.getElementById('newp').onclick = ()=>{ S.players=[]; go('setup'); };
}

if(new URLSearchParams(location.search).has('test') && PARTY.available()) runDiag();
else if(joinCode && PARTY.available()) startPlayer(joinCode);
else try{ render(); }catch(e){
  try{ localStorage.removeItem('mmnp'); }catch(_){}
  S = {phase:'setup', players:(S&&S.players)||[], q:0, turn:0, dots:{}, scores:{}, history:[]};
  render();
}
